<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choix de spécialité | PharmSinergy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: #f5f5f5;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 255, 255, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(180, 180, 180, 0.10),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #050505 0%,
                    #151515 35%,
                    #383838 55%,
                    #111111 78%,
                    #050505 100%
                );

            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;

            top: -170px;
            left: -150px;

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 0 80px rgba(255, 255, 255, 0.04),
                inset 0 0 80px rgba(255, 255, 255, 0.03);

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 520px;
            height: 520px;
            border-radius: 50%;

            right: -250px;
            bottom: -250px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            box-shadow:
                0 0 100px rgba(255, 255, 255, 0.04),
                inset 0 0 100px rgba(255, 255, 255, 0.03);

            pointer-events: none;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            position: relative;
            z-index: 2;
        }

        .calculator-decoration {
            position: absolute;
            width: 460px;
            height: 460px;

            border-radius: 50%;

            right: -160px;
            top: 50%;
            transform: translateY(-50%);

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 70px rgba(255, 255, 255, 0.035),
                inset 0 0 70px rgba(255, 255, 255, 0.025);

            opacity: 0.8;

            pointer-events: none;
        }

        .calculator-decoration::before {
            content: "";
            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .calculator-decoration::after {
            content: "";
            position: absolute;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .container {
            width: min(850px, 100%);

            padding: 42px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.12),
                    rgba(255, 255, 255, 0.035)
                );

            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            position: relative;
            z-index: 3;
        }

        .header {
            text-align: center;
            margin-bottom: 38px;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;

            color: rgba(255, 255, 255, 0.58);

            margin-bottom: 15px;
        }

        .title {
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 800;

            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    120deg,
                    #ffffff,
                    #bdbdbd,
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.60);
            font-weight: 500;
        }

        .back-button {
            position: absolute;

            top: 24px;
            left: 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 10px 17px;

            border-radius: 12px;

            color: rgba(255, 255, 255, 0.82);
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.13);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .back-button:hover {
            transform: translateX(-3px);

            background: rgba(255, 255, 255, 0.11);

            border-color: rgba(255, 255, 255, 0.24);
        }

        .choice-title {
            text-align: center;

            font-size: 18px;
            font-weight: 700;

            color: rgba(255, 255, 255, 0.88);

            margin-bottom: 25px;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 22px;

            margin-top: 10px;
        }

        .speciality-button {
            min-height: 190px;

            border-radius: 24px;

            border: 1px solid rgba(255, 255, 255, 0.16);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.11),
                    rgba(255, 255, 255, 0.035)
                );

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            color: #ffffff;

            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 18px;

            position: relative;
            overflow: hidden;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .speciality-button::before {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            top: -85px;
            right: -65px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            transition: transform 0.4s ease;
        }

        .speciality-button:hover {
            transform: translateY(-7px);

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.17),
                    rgba(255, 255, 255, 0.055)
                );

            border-color: rgba(255, 255, 255, 0.28);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }

        .speciality-button:hover::before {
            transform: scale(1.25);
        }

        .icon {
            width: 62px;
            height: 62px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            color: #ffffff;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.16),
                    rgba(255, 255, 255, 0.05)
                );

            border: 1px solid rgba(255, 255, 255, 0.16);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 8px 25px rgba(0, 0, 0, 0.20);
        }

        .speciality-name {
            font-size: 24px;
            font-weight: 800;

            letter-spacing: 2px;

            color: #ffffff;
        }

        .speciality-description {
            font-size: 12px;
            font-weight: 500;

            color: rgba(255, 255, 255, 0.48);
        }

        .info {
            text-align: center;

            margin-top: 30px;

            font-size: 12px;

            color: rgba(255, 255, 255, 0.42);

            line-height: 1.7;
        }

        @media (max-width: 700px) {

            .page {
                padding: 25px 15px;
            }

            .container {
                padding: 35px 20px 30px;
                border-radius: 24px;
            }

            .back-button {
                position: relative;

                top: auto;
                left: auto;

                margin-bottom: 25px;
            }

            .header {
                margin-bottom: 30px;
            }

            .title {
                font-size: 32px;
            }

            .choices {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .speciality-button {
                min-height: 160px;
            }

            .calculator-decoration {
                width: 300px;
                height: 300px;
            }
        }

        @media (max-width: 420px) {

            .container {
                padding: 28px 16px;
            }

            .brand {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 13px;
            }

            .speciality-button {
                min-height: 145px;
            }

            .icon {
                width: 55px;
                height: 55px;
            }

            .speciality-name {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="calculator-decoration"></div>

        <section class="container">

            <a href="licence3.html" class="back-button">
                ← Retour
            </a>

            <header class="header">

                <div class="brand">
                    PHARMSINERGY • CALCUL
                </div>

                <h1 class="title">
                    Calcul des moyennes
                </h1>

                <p class="subtitle">
                    Licence 3 — Pharmacie industrielle
                </p>

            </header>

            <div class="choice-title">
                Choisissez votre spécialité
            </div>

            <div class="choices">

                <button
                    class="speciality-button"
                    id="auxButton"
                    type="button"
                >

                    <div class="icon">
                        ⚗
                    </div>

                    <div class="speciality-name">
                        AUX
                    </div>

                    <div class="speciality-description">
                        Auxiliaire en pharmacie
                    </div>

                </button>


                <button
                    class="speciality-button"
                    id="ippsButton"
                    type="button"
                >

                    <div class="icon">
                        ⚕
                    </div>

                    <div class="speciality-name">
                        IPPS
                    </div>

                    <div class="speciality-description">
                        Industrie des produits pharmaceutiques et de santé
                    </div>

                </button>

            </div>

            <div class="info">
                Sélectionnez votre spécialité pour accéder à la
                calculatrice correspondante.
            </div>

        </section>

    </main>


    <script>

        const auxButton =
            document.getElementById("auxButton");

        const ippsButton =
            document.getElementById("ippsButton");


        auxButton.addEventListener(
            "click",
            function () {

                /*
                 * Page de calcul AUX à créer plus tard
                 */
                window.location.href =
                    "calculmoyennes3aux.html";

            }
        );


        ippsButton.addEventListener(
            "click",
            function () {

                /*
                 * Page de calcul IPPS à créer plus tard
                 */
                window.location.href =
                    "calculmoyennes3ipps.html";

            }
        );

    </script>

</body>
</html>

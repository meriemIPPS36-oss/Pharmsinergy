<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Licence 2 | PharmSinergy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kufam:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family:
                "Inter",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #42206f;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.96) 0%,
                    rgba(255,255,255,0.38) 23%,
                    transparent 48%
                ),

                radial-gradient(
                    circle at 8% 12%,
                    rgba(161,91,255,0.45),
                    transparent 31%
                ),

                radial-gradient(
                    circle at 92% 88%,
                    rgba(65,166,255,0.40),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #5f2caf 0%,
                    #8d54d6 28%,
                    #d9cdf5 52%,
                    #b8d8f5 76%,
                    #568fd7 100%
                );
        }


        /* ================= PAGE ================= */

        .page {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            isolation: isolate;
        }


        /* ================= BACKGROUND ================= */

        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(65px);

            pointer-events: none;

            z-index: -5;
        }

        .orb-one {
            width: 360px;
            height: 360px;

            top: -130px;
            right: -90px;

            background:
                rgba(195,145,255,0.30);

            animation:
                floatOne
                10s
                ease-in-out
                infinite;
        }

        .orb-two {
            width: 330px;
            height: 330px;

            bottom: -130px;
            left: -100px;

            background:
                rgba(74,181,255,0.27);

            animation:
                floatTwo
                12s
                ease-in-out
                infinite;
        }

        .orb-three {
            width: 180px;
            height: 180px;

            top: 42%;
            left: 42%;

            background:
                rgba(206,169,255,0.18);

            filter: blur(75px);
        }


        /* ================= MOLECULES ================= */

        .molecule {
            position: absolute;

            width: 170px;
            height: 170px;

            border:
                1px solid
                rgba(255,255,255,0.22);

            border-radius: 50%;

            pointer-events: none;

            opacity: 0.55;
        }

        .molecule::before,
        .molecule::after {
            content: "";

            position: absolute;

            border:
                1px solid
                rgba(255,255,255,0.22);

            border-radius: 50%;
        }

        .molecule::before {
            width: 95px;
            height: 95px;

            top: 37px;
            left: 37px;
        }

        .molecule::after {
            width: 12px;
            height: 12px;

            top: 14px;
            right: 22px;

            background:
                rgba(255,255,255,0.45);

            border: none;

            box-shadow:
                -115px 50px 0 rgba(255,255,255,0.30),
                55px 115px 0 rgba(255,255,255,0.25);
        }

        .molecule-one {
            top: 7%;
            left: 3%;

            transform:
                rotate(25deg);
        }

        .molecule-two {
            bottom: 3%;
            right: 2%;

            transform:
                rotate(-30deg);
        }


        /* ================= RINGS ================= */

        .ring {
            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.28);

            pointer-events: none;
        }

        .ring-one {
            width: 270px;
            height: 270px;

            left: -100px;
            top: 27%;
        }

        .ring-two {
            width: 360px;
            height: 360px;

            right: -145px;
            bottom: 8%;
        }


        /* ================= STARS ================= */

        .star {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.75);

            box-shadow:
                0 0 14px
                rgba(255,255,255,0.95);

            animation:
                twinkle
                3.5s
                ease-in-out
                infinite;
        }

        .star-one {
            top: 17%;
            left: 20%;
        }

        .star-two {
            top: 24%;
            right: 19%;

            width: 4px;
            height: 4px;

            animation-delay:
                1s;
        }

        .star-three {
            bottom: 19%;
            left: 23%;

            width: 4px;
            height: 4px;

            animation-delay:
                1.7s;
        }

        .star-four {
            bottom: 24%;
            right: 25%;

            width: 6px;
            height: 6px;

            animation-delay:
                2.2s;
        }


        /* ================= CARD ================= */

        .content {
            position: relative;

            width:
                min(720px, 82%);

            max-height:
                91vh;

            padding:
                19px
                27px
                24px;

            border-radius:
                29px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.45),
                    rgba(255,255,255,0.17)
                );

            border:
                1px solid
                rgba(255,255,255,0.70);

            box-shadow:

                0 28px 70px
                rgba(60,27,120,0.18),

                inset
                0 1px 0
                rgba(255,255,255,0.90);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            animation:
                cardAppear
                1s
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        /* ================= RETOUR ================= */

        .back-button {
            border: none;

            background:
                transparent;

            color:
                #60339b;

            font-size:
                0.76rem;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                transform .25s ease,
                color .25s ease;
        }

        .back-button:hover {
            transform:
                translateX(-4px);

            color:
                #401c77;
        }


        /* ================= HEADER ================= */

        .header {
            text-align:
                center;
        }

        .top-line {
            width:
                68px;

            height:
                3px;

            margin:
                1px
                auto
                13px;

            border-radius:
                999px;

            background:

                linear-gradient(
                    90deg,
                    #7940c8,
                    #b67cff,
                    #73b9ef
                );
        }

        .mini-label {
            font-size:
                0.62rem;

            font-weight:
                800;

            letter-spacing:
                0.28em;

            color:
                #77549a;

            text-transform:
                uppercase;

            margin-bottom:
                5px;
        }

        .title {
            font-family:
                "Kufam",
                sans-serif;

            font-size:
                clamp(
                    1.55rem,
                    3.4vw,
                    2.45rem
                );

            font-weight:
                800;

            color:
                #4b178f;

            text-shadow:
                0 5px 18px
                rgba(72,32,130,0.14);

            margin-bottom:
                4px;
        }

        .subtitle {
            font-size:
                clamp(
                    0.70rem,
                    1.2vw,
                    0.86rem
                );

            font-weight:
                600;

            color:
                #69468f;

            margin-bottom:
                4px;
        }


        /* ================= PHRASE ================= */

        .quote {
            direction:
                rtl;

            font-family:
                "Kufam",
                sans-serif;

            font-size:
                clamp(
                    0.64rem,
                    1.05vw,
                    0.80rem
                );

            color:
                #68458d;

            margin-top:
                2px;

            margin-bottom:
                15px;
        }


        /* ================= DIVIDER ================= */

        .divider {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            margin-bottom:
                15px;
        }

        .divider-line {
            width:
                62px;

            height:
                1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(105,60,161,0.45)
                );
        }

        .divider-line.right {
            background:
                linear-gradient(
                    90deg,
                    rgba(105,60,161,0.45),
                    transparent
                );
        }

        .divider-dot {
            width:
                5px;

            height:
                5px;

            border-radius:
                50%;

            background:
                #8151bc;

            box-shadow:
                0 0 10px
                rgba(129,81,188,0.40);
        }


        /* ================= OPTIONS ================= */

        .options {
            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                10px;
        }


        /* ================= OPTION ================= */

        .option {
            position:
                relative;

            min-height:
                70px;

            padding:
                10px
                13px;

            border-radius:
                17px;

            border:
                1px solid
                rgba(255,255,255,0.72);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.46),
                    rgba(255,255,255,0.18)
                );

            box-shadow:
                0 8px 20px
                rgba(70,31,130,0.08),

                inset
                0 1px 0
                rgba(255,255,255,0.75);

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            text-align:
                left;

            color:
                #4b247d;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;

            overflow:
                hidden;
        }

        .option::after {
            content:
                "";

            position:
                absolute;

            width:
                75px;

            height:
                75px;

            border-radius:
                50%;

            right:
                -30px;

            bottom:
                -47px;

            background:
                rgba(129,81,188,0.08);

            pointer-events:
                none;
        }

        .option:hover {
            transform:
                translateY(-4px);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.60),
                    rgba(255,255,255,0.25)
                );

            box-shadow:
                0 14px 28px
                rgba(70,31,130,0.14),

                0 0 20px
                rgba(157,111,238,0.12);
        }

        .option:active {
            transform:
                scale(0.975);
        }


        /* ================= ICON ================= */

        .icon-box {
            flex-shrink:
                0;

            width:
                38px;

            height:
                38px;

            border-radius:
                11px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #6334a0;

            background:
                linear-gradient(
                    135deg,
                    rgba(132,68,220,0.17),
                    rgba(82,142,220,0.15)
                );

            border:
                1px solid
                rgba(126,82,200,0.18);

            box-shadow:
                inset
                0 1px 4px
                rgba(255,255,255,0.55);
        }

        .icon-box svg {
            width:
                20px;

            height:
                20px;

            stroke:
                currentColor;

            fill:
                none;

            stroke-width:
                1.7;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;
        }


        /* ================= TEXT ================= */

        .option-text {
            display:
                flex;

            flex-direction:
                column;

            gap:
                3px;

            min-width:
                0;
        }

        .option-title {
            font-size:
                0.78rem;

            font-weight:
                800;

            color:
                #4b247d;
        }

        .option-subtitle {
            font-size:
                0.57rem;

            color:
                #775a94;

            font-weight:
                500;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes cardAppear {

            from {
                opacity:
                    0;

                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes floatOne {

            0%, 100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(-20px,18px);
            }

        }

        @keyframes floatTwo {

            0%, 100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(20px,-18px);
            }

        }

        @keyframes twinkle {

            0%, 100% {

                opacity:
                    .25;

                transform:
                    scale(.75);
            }

            50% {

                opacity:
                    1;

                transform:
                    scale(1.3);
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            body {
                overflow:
                    hidden;
            }

            .content {
                width:
                    91%;

                max-height:
                    94vh;

                padding:
                    17px
                    16px
                    20px;

                border-radius:
                    25px;
            }

            .back-button {
                font-size:
                    .68rem;
            }

            .mini-label {
                font-size:
                    .55rem;
            }

            .title {
                font-size:
                    1.48rem;
            }

            .subtitle {
                font-size:
                    .66rem;
            }

            .quote {
                font-size:
                    .62rem;

                margin-bottom:
                    14px;
            }

            .divider {
                margin-bottom:
                    13px;
            }

            .divider-line {
                width:
                    45px;
            }

            .options {
                gap:
                    8px;
            }

            .option {
                min-height:
                    63px;

                padding:
                    8px
                    9px;

                border-radius:
                    14px;

                gap:
                    8px;
            }

            .icon-box {
                width:
                    32px;

                height:
                    32px;

                border-radius:
                    9px;
            }

            .icon-box svg {
                width:
                    17px;

                height:
                    17px;
            }

            .option-title {
                font-size:
                    .63rem;
            }

            .option-subtitle {
                font-size:
                    .49rem;
            }

            .molecule {
                opacity:
                    .25;

                transform:
                    scale(.7);
            }

        }

    </style>

</head>


<body>

    <main class="page">


        <!-- BACKGROUND -->

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="ring ring-one"></div>

        <div class="ring ring-two"></div>

        <div class="molecule molecule-one"></div>

        <div class="molecule molecule-two"></div>

        <div class="star star-one"></div>

        <div class="star star-two"></div>

        <div class="star star-three"></div>

        <div class="star star-four"></div>


        <!-- MAIN CARD -->

        <section class="content">


            <!-- RETOUR -->

            <button
                class="back-button"
                id="backButton"
                type="button"
            >
                ← Retour
            </button>


            <!-- HEADER -->

            <header class="header">

                <div class="top-line"></div>

                <div class="mini-label">

                </div>

                <h1 class="title">
                    Bienvenue 
                </h1>

                <div class="subtitle">
                    Licence 3 — Pharmacie industrielle
                </div>

                    Troisième étape, nouveaux défis, encore plus de réussite
                </div>

            </header>

            <div class="divider">

                <span class="divider-line"></span>

                <span class="divider-dot"></span>

                <span class="divider-line right"></span>

            </div>


            <!-- OPTIONS -->

            <div class="options">


                <!-- RÉSUMÉS L3 -->

                <button
                    class="option"
                    id="resumesL3Button"
                    type="button"
                >

                    <span class="icon-box">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"
                            />

                            <path d="M5 4.5v17" />

                            <path d="M9 6h7" />

                            <path d="M9 10h7" />

                            <path d="M9 14h5" />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            Résumés L3
                        </span>

                        <span class="option-subtitle">
                            Fiches et synthèses des cours
                        </span>

                    </span>

                </button>


                <!-- EXAMENS L3 -->

                <button
                    class="option"
                    id="examensL3Button"
                    type="button"
                >

                    <span class="icon-box">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="3"
                                width="14"
                                height="18"
                                rx="2"
                            />

                            <path d="M8 7h8" />

                            <path d="M8 11h6" />

                            <path d="M8 15h4" />

                            <path d="M15 15l1.5 1.5L20 13" />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            Sujets d'examens L3
                        </span>

                        <span class="option-subtitle">
                            Anciens sujets et examens
                        </span>

                    </span>

                </button>


                <!-- DRIVES L3 -->

                <button
                    class="option"
                    id="lesdrives3Button"
                    type="button"
                >

                    <span class="icon-box">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"
                            />

                            <path d="M8 13h8" />

                            <path d="M12 9v8" />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            Les Drives L3
                        </span>

                        <span class="option-subtitle">
                            Documents et ressources
                        </span>

                    </span>

                </button>


                <!-- CARNET L3 -->

                <button
                    class="option"
                    id="carnetL3Button"
                    type="button"
                >

                    <span class="icon-box">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M6 3h10a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"
                            />

                            <path
                                d="M18 7h2v12a2 2 0 0 1-2 2"
                            />

                            <path d="M8 8h7" />

                            <path d="M8 12h7" />

                            <path d="M8 16h5" />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            Carnet de l'étudiant L3
                        </span>

                        <span class="option-subtitle">
                            Organisation et suivi étudiant
                        </span>

                    </span>

                </button>


                <!-- CHATGPT -->

                <button
                    class="option"
                    id="aiButton"
                    type="button"
                >

                    <span class="icon-box">

                        <svg
                            viewBox="0 0 24 24"
                            width="21"

                            <path

                                a4 4 0 0 1 3.1 4

                            <path

                            />

                            <path
                                d="M12 6.1v4.2"
                            />

                            <path
                                d="M15.8 8.2L12 10.3"
                            />

                            <path
                                d="M12 14.4v3.9"
                            />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            ChatGPT
                        </span>

                        <span class="option-subtitle">
                            Posez vos questions à ChatGPT
                        </span>

                    </span>

                </button>


                <!-- CALCULATEUR L3 -->

                <button
                    class="option"
                    id="calculatorL3Button"
                    type="button"
                >

                    <span class="icon-box">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="5"
                                y="2.5"
                                width="14"
                                height="19"
                                rx="2.5"
                            />

                            <rect
                                x="8"
                                y="5"
                                width="8"
                                height="3"
                                rx="0.8"
                            />

                            <path d="M8 11h2" />
                            <path d="M12 11h2" />
                            <path d="M16 11h0.01" />

                            <path d="M8 15h2" />
                            <path d="M12 15h2" />
                            <path d="M16 15h0.01" />

                            <path d="M8 19h2" />
                            <path d="M12 19h2" />
                            <path d="M16 19h0.01" />

                        </svg>

                    </span>

                    <span class="option-text">

                        <span class="option-title">
                            Calculateur de moyennes L3
                        </span>

                        <span class="option-subtitle">
                            Calculez vos moyennes de Licence 3
                        </span>

                    </span>

                </button>


            </div>

        </section>

    </main>


    <script>


        /* =====================================================
           RETOUR → PAGE 3
        ===================================================== */

        document
            .getElementById("backButton")
            .addEventListener("click", function () {

                window.location.href =
                    "page3.html";

            });


        /* =====================================================
           RÉSUMÉS L3
        ===================================================== */

        document
            .getElementById("resumesL3Button")
            .addEventListener("click", function () {

                window.location.href =
                    "resumes-l3.html";

            });


        /* =====================================================
           EXAMENS L3
        ===================================================== */

        document
            .getElementById("examensL3Button")
            .addEventListener("click", function () {

                window.location.href =
                    "examens-l3.html";

            });


        /* =====================================================
           DRIVES L3
        ===================================================== */

        document
            .getElementById("lesdrives3Button")
            .addEventListener("click", function () {

                window.location.href =
                    "lesdrives3.html";

            });

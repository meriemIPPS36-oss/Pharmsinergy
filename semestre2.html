<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Semestre 2 | PharmSinergy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kufam:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.30),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(255,255,255,0.20),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #5f2caf 0%,
                    #8d54d6 25%,
                    #d9cdf5 50%,
                    #b8d8f5 72%,
                    #568fd7 100%
                );

            color: #24213b;
            overflow: hidden;
        }

        .page {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            isolation: isolate;
        }

        /* =========================
           DECORATIONS
        ========================== */

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            z-index: -1;
        }

        .orb.one {
            width: 230px;
            height: 230px;

            top: -70px;
            left: -70px;

            background: rgba(255,255,255,0.16);

            animation: floatOne 7s ease-in-out infinite;
        }

        .orb.two {
            width: 180px;
            height: 180px;

            right: -45px;
            bottom: 70px;

            background: rgba(95,44,175,0.13);

            animation: floatTwo 8s ease-in-out infinite;
        }

        .orb.three {
            width: 90px;
            height: 90px;

            right: 18%;
            top: 10%;

            background: rgba(255,255,255,0.18);

            animation: floatOne 6s ease-in-out infinite;
        }

        .molecule {
            position: absolute;

            width: 95px;
            height: 95px;

            border: 1px solid rgba(255,255,255,0.35);

            border-radius: 50%;

            z-index: -1;
        }

        .molecule::before,
        .molecule::after {
            content: "";

            position: absolute;

            border-radius: 50%;

            background: rgba(255,255,255,0.45);
        }

        .molecule::before {
            width: 12px;
            height: 12px;

            top: 5px;
            right: 12px;
        }

        .molecule::after {
            width: 9px;
            height: 9px;

            bottom: 8px;
            left: 10px;
        }

        .molecule.one {
            left: 7%;
            bottom: 13%;
        }

        .molecule.two {
            right: 8%;
            top: 22%;

            transform: scale(0.7);
        }

        .ring {
            position: absolute;

            border: 1px solid rgba(255,255,255,0.28);

            border-radius: 50%;

            z-index: -1;
        }

        .ring.one {
            width: 180px;
            height: 180px;

            left: -80px;
            top: 42%;

            transform: rotate(25deg);
        }

        .ring.two {
            width: 140px;
            height: 140px;

            right: -50px;
            top: 18%;

            transform: rotate(-20deg);
        }

        .star {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: rgba(255,255,255,0.65);

            z-index: -1;

            animation: twinkle 2.8s ease-in-out infinite;
        }

        .star.one {
            left: 16%;
            top: 18%;
        }

        .star.two {
            right: 18%;
            top: 32%;

            animation-delay: 0.7s;
        }

        .star.three {
            left: 24%;
            bottom: 16%;

            animation-delay: 1.2s;
        }

        .star.four {
            right: 30%;
            bottom: 12%;

            animation-delay: 1.8s;
        }

        /* =========================
           MAIN CARD
        ========================== */

        .content {
            position: relative;

            width: min(850px, 86%);
            max-height: 92vh;

            padding: 24px 40px 30px;

            border-radius: 32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.43),
                    rgba(255,255,255,0.18)
                );

            border: 1px solid rgba(255,255,255,0.65);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 60px rgba(48,33,95,0.20),
                inset 0 1px 0 rgba(255,255,255,0.7);

            animation: cardAppear 0.8s ease-out forwards;

            overflow: auto;

            scrollbar-width: none;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           TOP
        ========================== */

        .top {
            position: relative;

            text-align: center;
        }

        .back-button {
            position: absolute;

            left: 0;
            top: 0;

            display: inline-flex;
            align-items: center;
            gap: 6px;

            padding: 6px 10px;

            border: none;
            background: transparent;

            color: #5f2caf;

            font-family: "Inter", sans-serif;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .back-button:hover {
            transform: translateX(-4px);

            color: #3f1d82;
        }

        .brand {
            font-family: "Kufam", sans-serif;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 2.5px;

            color: #5f2caf;

            margin-bottom: 12px;
        }

        h1 {
            font-family: "Kufam", sans-serif;

            font-size: clamp(27px, 4vw, 38px);
            font-weight: 700;

            color: #292044;

            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 500;

            color: rgba(36,33,59,0.72);

            margin-bottom: 18px;
        }

        .divider {
            width: 100%;
            height: 1px;

            background: rgba(95,44,175,0.18);

            position: relative;

            margin-bottom: 22px;
        }

        .divider::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #6f42c1;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 0 5px rgba(111,66,193,0.10);
        }

        /* =========================
           MODULES
        ========================== */

        .modules {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 13px;

            width: 100%;
        }

        .module-button {
            min-height: 61px;

            display: flex;
            align-items: center;

            gap: 11px;

            padding: 10px 13px;

            border-radius: 17px;

            border: 1px solid rgba(255,255,255,0.55);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.42),
                    rgba(255,255,255,0.20)
                );

            box-shadow:
                0 8px 20px rgba(48,33,95,0.08),
                inset 0 1px 0 rgba(255,255,255,0.55);

            color: #292044;

            text-decoration: none;

            font-size: 12.5px;
            font-weight: 600;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .module-button:hover {
            transform: translateY(-4px);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.60),
                    rgba(255,255,255,0.30)
                );

            box-shadow:
                0 13px 26px rgba(48,33,95,0.14),
                inset 0 1px 0 rgba(255,255,255,0.75);
        }

        .icon-box {
            flex: 0 0 35px;

            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    rgba(95,44,175,0.18),
                    rgba(86,143,215,0.18)
                );

            border: 1px solid rgba(95,44,175,0.12);

            color: #5f2caf;

            font-size: 15px;
            font-weight: 700;
        }

        .module-name {
            line-height: 1.3;
        }

        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes floatOne {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes floatTwo {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(18px);
            }
        }

        @keyframes twinkle {

            0%, 100% {
                opacity: 0.35;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            .content {
                width: 92%;
                padding: 22px 22px 25px;
            }

            .modules {
                grid-template-columns: repeat(2, 1fr);
            }

            .module-button {
                font-size: 12px;
            }
        }

        @media (max-width: 390px) {

            .content {
                padding: 20px 16px 22px;
            }

            .modules {
                grid-template-columns: 1fr;
            }

            .back-button {
                font-size: 12px;
            }

            .brand {
                margin-top: 5px;
            }
        }

    </style>

</head>


<body>

    <div class="page">

        <!-- Décorations -->

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="molecule one"></div>
        <div class="molecule two"></div>

        <div class="ring one"></div>
        <div class="ring two"></div>

        <div class="star one"></div>
        <div class="star two"></div>
        <div class="star three"></div>
        <div class="star four"></div>


        <!-- Carte principale -->

        <main class="content">

            <div class="top">

                <a
                    href="resumes-l1.html"
                    class="back-button"
                >
                    ← Retour
                </a>

                <div class="brand">
                    PHARMSINERGY
                </div>

                <h1>
                    Semestre 2
                </h1>

                <p class="subtitle">
                    Modules — Licence 1 Pharmacie industrielle
                </p>

                <div class="divider"></div>

            </div>


            <!-- Modules -->

            <div class="modules">

                <a
                    href="chimie-generale2.html"
                    class="module-button"
                >
                    <span class="icon-box">CG</span>

                    <span class="module-name">
                        Chimie générale 2
                    </span>
                </a>


                <a
                    href="chimie-inorganique.html"
                    class="module-button"
                >
                    <span class="icon-box">CI</span>

                    <span class="module-name">
                        Chimie inorganique
                    </span>
                </a>


                <a
                    href="methode-physique.html"
                    class="module-button"
                >
                    <span class="icon-box">MP</span>

                    <span class="module-name">
                        Méthode physique
                    </span>
                </a>


                <a
                    href="methode-chimique.html"
                    class="module-button"
                >
                    <span class="icon-box">MC</span>

                    <span class="module-name">
                        Méthode chimique
                    </span>
                </a>


                <a
                    href="anatomie-physiologie-pathologie.html"
                    class="module-button"
                >
                    <span class="icon-box">AP</span>

                    <span class="module-name">
                        Anatomie - Physiologie - Pathologie
                    </span>
                </a>


                <a
                    href="taxonomie.html"
                    class="module-button"
                >
                    <span class="icon-box">TX</span>

                    <span class="module-name">
                        Taxonomie
                    </span>
                </a>


                <a
                    href="anglais2.html"
                    class="module-button"
                >
                    <span class="icon-box">A2</span>

                    <span class="module-name">
                        Anglais 2
                    </span>
                </a>


                <a
                    href="histoire-pharmacie.html"
                    class="module-button"
                >
                    <span class="icon-box">HP</span>

                    <span class="module-name">
                        Histoire de pharmacie
                    </span>
                </a>

            </div>

        </main>

    </div>

</body>

</html>

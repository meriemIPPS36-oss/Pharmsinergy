<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PharmSinergy</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kufam:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {
            min-height: 100vh;

            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.96) 0%,
                    rgba(255,255,255,0.38) 22%,
                    transparent 48%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(155,84,255,0.42),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(73,170,255,0.40),
                    transparent 33%
                ),

                linear-gradient(
                    135deg,
                    #5f2caf 0%,
                    #8d54d6 27%,
                    #d9cdf5 52%,
                    #b8d8f5 76%,
                    #568fd7 100%
                );
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            position: relative;

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            isolation: isolate;
        }


        /* =====================================================
           BACKGROUND ORBS
        ===================================================== */

        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(55px);

            pointer-events: none;

            z-index: -4;
        }


        .orb-one {

            width: 330px;

            height: 330px;

            top: -100px;

            right: -80px;

            background:
                rgba(191,140,255,0.30);

            animation:
                orbFloat
                9s
                ease-in-out
                infinite;
        }


        .orb-two {

            width: 300px;

            height: 300px;

            left: -90px;

            bottom: -80px;

            background:
                rgba(102,193,255,0.26);

            animation:
                orbFloat
                11s
                ease-in-out
                infinite reverse;
        }


        /* =====================================================
           RINGS
        ===================================================== */

        .ring {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.34);

            pointer-events: none;
        }


        .ring-one {

            width: 260px;

            height: 260px;

            left: -80px;

            top: 28%;
        }


        .ring-two {

            width: 340px;

            height: 340px;

            right: -120px;

            bottom: 10%;
        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        .spark {

            position: absolute;

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.74);

            box-shadow:
                0 0 13px
                rgba(255,255,255,0.95);

            animation:
                sparkle
                3s
                ease-in-out
                infinite;
        }


        .spark-one {

            top: 18%;

            left: 13%;
        }


        .spark-two {

            top: 28%;

            right: 16%;

            width: 5px;

            height: 5px;

            animation-delay:
                0.8s;
        }


        .spark-three {

            bottom: 23%;

            left: 19%;

            width: 4px;

            height: 4px;

            animation-delay:
                1.3s;
        }


        .spark-four {

            bottom: 16%;

            right: 21%;

            width: 6px;

            height: 6px;

            animation-delay:
                1.8s;
        }


        /* =====================================================
           DOTS
        ===================================================== */

        .dot {

            position: absolute;

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background:
                rgba(123,64,194,0.44);

            box-shadow:
                0 0 10px
                rgba(171,126,255,0.45);

            animation:
                dotMove
                5s
                ease-in-out
                infinite;
        }


        .dot-one {

            left: 27%;

            top: 14%;
        }


        .dot-two {

            right: 29%;

            top: 18%;

            animation-delay:
                1s;
        }


        .dot-three {

            left: 23%;

            bottom: 17%;

            animation-delay:
                1.7s;
        }


        .dot-four {

            right: 25%;

            bottom: 14%;

            animation-delay:
                2.2s;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {

            position: absolute;

            top: 25px;

            left: 28px;

            padding:
                9px
                18px;

            border:
                1px solid
                rgba(255,255,255,0.65);

            border-radius: 999px;

            background:
                rgba(255,255,255,0.22);

            color:
                #55218c;

            text-decoration:
                none;

            font-size:
                0.82rem;

            font-weight:
                700;

            direction:
                ltr;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 7px 20px
                rgba(75,35,135,0.10);

            transition:
                all 0.25s ease;

            z-index:
                20;
        }


        .back-button:hover {

            transform:
                translateX(-3px);

            background:
                rgba(255,255,255,0.40);

            box-shadow:
                0 10px 25px
                rgba(75,35,135,0.16);
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .content {

            width:
                min(720px, 82%);

            max-height:
                88vh;

            padding:
                30px
                28px
                42px;

            border-radius:
                30px;

            background:

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.42),
                    rgba(250,246,255,0.19)
                );

            border:
                1px solid
                rgba(255,255,255,0.68);

            box-shadow:

                0 24px 60px
                rgba(68,32,128,0.15),

                inset
                0 1px 0
                rgba(255,255,255,0.85);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            text-align:
                center;

            animation:
                cardEntrance
                1.2s
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .top-line {

            width:
                85px;

            height:
                3px;

            margin:
                0
                auto
                18px;

            border-radius:
                999px;

            background:

                linear-gradient(
                    90deg,
                    #7940c8,
                    #b67cff,
                    #73b9ef
                );
        }


        .title {

            font-size:
                clamp(
                    1.7rem,
                    3.5vw,
                    2.8rem
                );

            font-weight:
                800;

            color:
                #4b178f;

            margin-bottom:
                8px;

            text-shadow:
                0 4px 15px
                rgba(72,32,130,0.14);

            animation:
                fadeUp
                0.9s
                ease
                0.25s
                both;
        }


        .subtitle {

            font-size:
                clamp(
                    0.72rem,
                    1.2vw,
                    0.9rem
                );

            color:
                #67458c;

            margin-bottom:
                20px;

            animation:
                fadeUp
                0.9s
                ease
                0.4s
                both;
        }


        /* =====================================================
           PHARMACY DECORATION
        ===================================================== */

        .pharmacy-symbol {

            width:
                62px;

            height:
                62px;

            margin:
                0
                auto
                18px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:

                linear-gradient(
                    135deg,
                    rgba(132,68,220,0.92),
                    rgba(82,142,220,0.92)
                );

            color:
                white;

            font-size:
                1.7rem;

            box-shadow:

                0 10px 28px
                rgba(76,34,147,0.24),

                inset
                0 2px 8px
                rgba(255,255,255,0.30);

            animation:
                symbolFloat
                4s
                ease-in-out
                infinite;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .buttons {

            margin-top:
                5px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            gap:
                11px;

            animation:
                fadeUp
                1s
                ease
                0.65s
                both;
        }


        .choice-button {

            width:
                min(390px, 82%);

            min-height:
                43px;

            padding:
                10px
                20px;

            border:
                1px solid
                rgba(255,255,255,0.78);

            border-radius:
                999px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.50),
                    rgba(255,255,255,0.25)
                );

            color:
                #54228d;

            font-size:
                0.84rem;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:

                0 8px 20px
                rgba(75,35,135,0.12),

                inset
                0 1px 0
                rgba(255,255,255,0.80);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            transition:

                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }


        .choice-button:hover {

            transform:
                translateY(-3px)
                scale(1.02);

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.70),
                    rgba(255,255,255,0.38)
                );

            box-shadow:
                0 13px 28px
                rgba(75,35,135,0.18);
        }


        .choice-button:active {

            transform:
                scale(0.98);
        }


        /* =====================================================
           STAGES
        ===================================================== */

        .stage-button {

            margin-bottom:
                4px;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes cardEntrance {

            from {

                opacity:
                    0;

                transform:
                    translateY(28px)
                    scale(0.97);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes fadeUp {

            from {

                opacity:
                    0;

                transform:
                    translateY(16px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        @keyframes orbFloat {

            0%,
            100% {

                transform:
                    translate(0,0);
            }

            50% {

                transform:
                    translate(20px,-15px);
            }
        }


        @keyframes sparkle {

            0%,
            100% {

                opacity:
                    0.25;

                transform:
                    scale(0.8);
            }

            50% {

                opacity:
                    1;

                transform:
                    scale(1.25);
            }
        }


        @keyframes dotMove {

            0%,
            100% {

                transform:
                    translate(0,0);
            }

            50% {

                transform:
                    translate(5px,-8px);
            }
        }


        @keyframes symbolFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-5px);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            .content {

                width:
                    90%;

                max-height:
                    90vh;

                padding:
                    25px
                    18px
                    34px;

                border-radius:
                    26px;
            }


            .back-button {

                top:
                    17px;

                left:
                    17px;

                padding:
                    8px
                    14px;

                font-size:
                    0.72rem;
            }


            .pharmacy-symbol {

                width:
                    52px;

                height:
                    52px;

                font-size:
                    1.4rem;

                margin-bottom:
                    13px;
            }


            .title {

                font-size:
                    clamp(
                        1.45rem,
                        7vw,
                        2.2rem
                    );
            }


            .subtitle {

                font-size:
                    0.68rem;

                margin-bottom:
                    15px;
            }


            .buttons {

                gap:
                    9px;

                margin-top:
                    0;
            }


            .choice-button {

                width:
                    88%;

                min-height:
                    40px;

                padding:
                    9px
                    16px;

                font-size:
                    0.76rem;
            }


            .ring-one,
            .ring-two {

                opacity:
                    0.45;
            }


            .spark {

                transform:
                    scale(0.75);
            }
        }

    </style>

</head>


<body>

    <main class="page">


        <!-- =====================================================
             BACKGROUND
        ===================================================== -->

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="ring ring-one"></div>

        <div class="ring ring-two"></div>

        <div class="spark spark-one"></div>

        <div class="spark spark-two"></div>

        <div class="spark spark-three"></div>

        <div class="spark spark-four"></div>

        <div class="dot dot-one"></div>

        <div class="dot dot-two"></div>

        <div class="dot dot-three"></div>

        <div class="dot dot-four"></div>


        <!-- =====================================================
             RETOUR
        ===================================================== -->

        <a
            href="page2.html"
            class="back-button"
        >
            ← Retour
        </a>


        <!-- =====================================================
             MAIN CONTENT
        ===================================================== -->

        <section class="content">


            <div class="top-line"></div>


            <!-- Pharmacy symbol -->

            <div class="pharmacy-symbol">
                ⚕
            </div>


            <h1 class="title">
                PharmSinergy
            </h1>


            <p class="subtitle">
                Explorez votre parcours en pharmacie industrielle
            </p>


            <!-- =================================================
                 CHOICES
            ================================================= -->

            <div class="buttons">


                <!-- PHARMACIE INDUSTRIELLE -->

                <button
                    class="choice-button"
                    type="button"
                    onclick="window.location.href='presentation.html'"
                >
                    Découvrir la Pharmacie Industrielle
                </button>


                <!-- LICENCE 1 -->

                <button
                    class="choice-button"
                    type="button"
                    onclick="window.location.href='page4.html'"
                >
                    Licence 1
                </button>


                <!-- LICENCE 2 -->

                <button
                    class="choice-button"
                    type="button"
                    onclick="window.location.href='licence2.html'"
                >
                    Licence 2
                </button>


                <!-- LICENCE 3 -->

                <button
                    class="choice-button"
                    type="button"
                    onclick="window.location.href='licence3.html'"
                >
                    Licence 3
                </button>


                <!-- STAGES -->

                <button
                    class="choice-button stage-button"
                    type="button"
                    onclick="window.location.href='stages.html'"
                >
                    Stages
                </button>


            </div>

        </section>

    </main>

</body>

</html>

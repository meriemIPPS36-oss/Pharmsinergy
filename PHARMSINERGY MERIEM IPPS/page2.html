<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PharmSinergy</title>

    <!-- Kufi Arabic Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Kufam:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET + SAME PAGE SIZE
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            color: #42206f;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255,255,255,0.97) 0%,
                    rgba(255,255,255,0.40) 22%,
                    transparent 48%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(155,84,255,0.42),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(73,170,255,0.40),
                    transparent 33%
                ),

                linear-gradient(
                    135deg,
                    #5f2caf 0%,
                    #8d54d6 27%,
                    #d9cdf5 52%,
                    #b8d8f5 76%,
                    #568fd7 100%
                );
        }

        button {
            font: inherit;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            isolation: isolate;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {
            position: absolute;

            top: 25px;
            left: 28px;

            padding: 9px 18px;

            border: 1px solid rgba(255,255,255,0.65);

            border-radius: 999px;

            background: rgba(255,255,255,0.22);

            color: #55218c;

            text-decoration: none;

            font-size: 0.82rem;
            font-weight: 700;

            direction: ltr;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 7px 20px rgba(75,35,135,0.10);

            transition: all 0.25s ease;

            z-index: 20;
        }

        .back-button:hover {
            transform: translateX(-3px);

            background: rgba(255,255,255,0.40);

            box-shadow:
                0 10px 25px rgba(75,35,135,0.16);
        }


        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(55px);

            pointer-events: none;

            z-index: -4;
        }

        .orb-one {
            width: 330px;
            height: 330px;

            top: -100px;
            right: -80px;

            background:
                rgba(191,140,255,0.30);

            animation:
                orbFloat
                9s
                ease-in-out
                infinite;
        }

        .orb-two {
            width: 300px;
            height: 300px;

            left: -90px;
            bottom: -80px;

            background:
                rgba(102,193,255,0.26);

            animation:
                orbFloat
                11s
                ease-in-out
                infinite reverse;
        }


        /* =====================================================
           DECORATIVE RINGS
        ===================================================== */

        .ring {
            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.34);

            pointer-events: none;
        }

        .ring-one {
            width: 260px;
            height: 260px;

            left: -80px;
            top: 28%;

            transform:
                rotate(-18deg);
        }

        .ring-two {
            width: 340px;
            height: 340px;

            right: -120px;
            bottom: 10%;

            transform:
                rotate(21deg);
        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        .spark {
            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.74);

            box-shadow:
                0 0 13px rgba(255,255,255,0.95);

            animation:
                sparkle
                3s
                ease-in-out
                infinite;
        }

        .spark-one {
            top: 18%;
            left: 13%;
        }

        .spark-two {
            top: 28%;
            right: 16%;

            width: 5px;
            height: 5px;

            animation-delay: 0.8s;
        }

        .spark-three {
            bottom: 23%;
            left: 19%;

            width: 4px;
            height: 4px;

            animation-delay: 1.3s;
        }

        .spark-four {
            bottom: 16%;
            right: 21%;

            width: 6px;
            height: 6px;

            animation-delay: 1.8s;
        }


        /* =====================================================
           SMALL DOTS
        ===================================================== */

        .dot {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background:
                rgba(123,64,194,0.44);

            box-shadow:
                0 0 10px rgba(171,126,255,0.45);

            animation:
                dotMove
                5s
                ease-in-out
                infinite;
        }

        .dot-one {
            left: 27%;
            top: 14%;
        }

        .dot-two {
            right: 29%;
            top: 18%;

            animation-delay: 1s;
        }

        .dot-three {
            left: 23%;
            bottom: 17%;

            animation-delay: 1.7s;
        }

        .dot-four {
            right: 25%;
            bottom: 14%;

            animation-delay: 2.2s;
        }


        /* =====================================================
           GLASS CARD
        ===================================================== */

        .content {
            width: min(720px, 82%);

            max-height: 88vh;

            text-align: center;

            padding:
                34px
                28px
                36px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.42),
                    rgba(250,246,255,0.19)
                );

            border:
                1px solid
                rgba(255,255,255,0.68);

            box-shadow:
                0 24px 60px
                rgba(68,32,128,0.15),

                inset
                0 1px 0
                rgba(255,255,255,0.85);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            animation:
                cardEntrance
                1.2s
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        /* =====================================================
           TOP LINE
        ===================================================== */

        .top-line {
            width: 85px;
            height: 3px;

            margin:
                0
                auto
                22px;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #7940c8,
                    #b67cff,
                    #73b9ef
                );
        }


        /* =====================================================
           INTRO
        ===================================================== */

        .intro {
            font-size:
                clamp(
                    0.75rem,
                    1.2vw,
                    0.92rem
                );

            color: #64408c;

            margin-bottom: 18px;

            animation:
                fadeUp
                0.9s
                ease
                0.35s
                both;
        }


        /* =====================================================
           MAIN PRAYER
        ===================================================== */

        .prayer {
            position: relative;

            font-family:
                "Kufam",
                "Noto Kufi Arabic",
                Arial,
                sans-serif;

            font-size:
                clamp(
                    1.85rem,
                    4vw,
                    3.7rem
                );

            line-height: 1.8;

            font-weight: 700;

            letter-spacing: 0.02em;

            color: #4b178f;

            text-shadow:
                0 4px 15px
                rgba(72,32,130,0.14);

            animation:
                prayerReveal
                1.5s
                ease
                0.55s
                both;
        }


        .prayer::before,
        .prayer::after {
            position: absolute;

            font-family:
                Georgia,
                serif;

            font-size: 3rem;

            line-height: 1;

            color:
                rgba(136,77,205,0.28);
        }

        .prayer::before {
            content: "۞";

            top: -2px;
            right: -28px;
        }

        .prayer::after {
            content: "۞";

            bottom: -12px;
            left: -28px;
        }


        /* =====================================================
           SEPARATOR
        ===================================================== */

        .separator {
            width: 120px;
            height: 1px;

            margin:
                20px
                auto
                20px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(106,60,161,0.45),
                    transparent
                );

            animation:
                fadeUp
                0.8s
                ease
                0.9s
                both;
        }


        /* =====================================================
           SMALL TEXT
        ===================================================== */

        .small-text {
            font-size:
                clamp(
                    0.74rem,
                    1.15vw,
                    0.92rem
                );

            color: #67458c;

            animation:
                fadeUp
                0.8s
                ease
                1s
                both;
        }


        /* =====================================================
           START BUTTON
        ===================================================== */

        .start-button {
            margin-top: 27px;

            min-width: 190px;

            padding:
                12px
                30px;

            border:
                1px solid
                rgba(255,255,255,0.85);

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #8444dc,
                    #642bb9 52%,
                    #528edc
                );

            color: white;

            font-size: 0.88rem;

            font-weight: 800;

            letter-spacing: 0.22em;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(76,34,147,0.25),

                inset
                0 2px 8px
                rgba(255,255,255,0.27);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;

            animation:
                buttonEntrance
                0.9s
                ease
                1.25s
                both,

                buttonGlow
                3s
                ease-in-out
                2s
                infinite;
        }

        .start-button:hover {
            transform:
                translateY(-4px)
                scale(1.04);

            filter: brightness(1.08);

            box-shadow:
                0 16px 34px
                rgba(76,34,147,0.32),

                0 0 24px
                rgba(164,117,255,0.23),

                inset
                0 2px 8px
                rgba(255,255,255,0.32);
        }

        .start-button:active {
            transform: scale(0.97);
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes cardEntrance {
            from {
                opacity: 0;

                transform:
                    translateY(28px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;

                transform:
                    translateY(16px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes prayerReveal {
            0% {
                opacity: 0;

                transform:
                    translateY(16px);

                filter: blur(5px);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0);

                filter: blur(0);
            }
        }

        @keyframes buttonEntrance {
            from {
                opacity: 0;

                transform:
                    translateY(18px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes buttonGlow {
            0%, 100% {
                box-shadow:
                    0 10px 25px
                    rgba(76,34,147,0.25),

                    inset
                    0 2px 8px
                    rgba(255,255,255,0.27);
            }

            50% {
                box-shadow:
                    0 13px 32px
                    rgba(83,39,170,0.34),

                    0 0 22px
                    rgba(163,115,255,0.20),

                    inset
                    0 2px 8px
                    rgba(255,255,255,0.32);
            }
        }

        @keyframes orbFloat {
            0%, 100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(20px,-15px);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.25;

                transform:
                    scale(0.8);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.25);
            }
        }

        @keyframes dotMove {
            0%, 100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(5px,-8px);
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            .content {
                width: 90%;

                max-height: 88vh;

                padding:
                    28px
                    18px
                    30px;

                border-radius: 26px;
            }

            .back-button {
                top: 17px;
                left: 17px;

                padding:
                    8px
                    14px;

                font-size: 0.72rem;
            }

            .top-line {
                width: 70px;

                margin-bottom: 18px;
            }

            .intro {
                font-size: 0.70rem;

                margin-bottom: 15px;
            }

            .prayer {
                font-size:
                    clamp(
                        1.6rem,
                        8.5vw,
                        2.8rem
                    );

                line-height: 1.8;
            }

            .prayer::before {
                right: -12px;

                font-size: 2.3rem;
            }

            .prayer::after {
                left: -12px;

                font-size: 2.3rem;
            }

            .separator {
                width: 90px;

                margin:
                    16px
                    auto;
            }

            .small-text {
                font-size: 0.70rem;
            }

            .start-button {
                min-width: 175px;

                padding:
                    11px
                    25px;

                font-size: 0.80rem;
            }

            .ring-one,
            .ring-two {
                opacity: 0.45;
            }

            .spark {
                transform: scale(0.75);
            }
        }

    </style>

</head>


<body>

    <main class="page">

        <!-- Background decoration -->

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>

        <div class="spark spark-one"></div>
        <div class="spark spark-two"></div>
        <div class="spark spark-three"></div>
        <div class="spark spark-four"></div>

        <div class="dot dot-one"></div>
        <div class="dot dot-two"></div>
        <div class="dot dot-three"></div>
        <div class="dot dot-four"></div>


        <!-- BACK BUTTON -->

        <a
            href="index.html"
            class="back-button"
        >← Retour</a>


        <!-- Main glass card -->

        <section class="content">

            <div class="top-line"></div>

            <div class="intro">
                اللهم صل وسلم وبارك على سيدنا محمد ﷺ
            </div>

            <div class="prayer">
                اللهم صل وسلم وبارك على سيدنا محمد ﷺ
            </div>

            <div class="separator"></div>

            <div class="small-text">
                أجر لنا ولكم
            </div>

            <button
                class="start-button"
                id="startButton"
                type="button"
            >
                START
            </button>

        </section>

    </main>


    <script>

        const startButton =
            document.getElementById("startButton");

        startButton.addEventListener(
            "click",
            function () {

                window.location.href =
                    "page3.html";

            }
        );

    </script>

</body>

</html>

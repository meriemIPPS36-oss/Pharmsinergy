<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts | PharmSinergy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kufam:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, rgba(125, 70, 210, 0.30), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(50, 120, 255, 0.25), transparent 35%),
                linear-gradient(
                    135deg,
                    #7d4ed2 0%,
                    #ffffff 48%,
                    #4f8eea 100%
                );
            position: relative;
            color: #272052;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* Background glow */

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            pointer-events: none;
        }

        .glow-one {
            width: 300px;
            height: 300px;
            background: rgba(112, 58, 210, 0.20);
            top: -80px;
            left: -80px;
        }

        .glow-two {
            width: 350px;
            height: 350px;
            background: rgba(61, 126, 235, 0.20);
            bottom: -120px;
            right: -100px;
        }

        /* Decorative molecules */

        .molecule-left,
        .molecule-right {
            position: absolute;
            width: 180px;
            height: 180px;
            opacity: 0.30;
            pointer-events: none;
        }

        .molecule-left {
            left: 3%;
            top: 12%;
        }

        .molecule-right {
            right: 3%;
            bottom: 12%;
        }

        .atom {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7951d7, #4e88e9);
            box-shadow: 0 0 18px rgba(92, 71, 194, 0.45);
        }

        .atom.one {
            top: 15px;
            left: 70px;
        }

        .atom.two {
            top: 85px;
            left: 20px;
        }

        .atom.three {
            top: 110px;
            left: 125px;
        }

        .atom.four {
            top: 55px;
            left: 105px;
        }

        .bond {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, #7650d3, #5388e7);
            transform-origin: left center;
            border-radius: 10px;
        }

        .bond.one {
            width: 65px;
            top: 28px;
            left: 82px;
            transform: rotate(65deg);
        }

        .bond.two {
            width: 70px;
            top: 95px;
            left: 35px;
            transform: rotate(-20deg);
        }

        .bond.three {
            width: 50px;
            top: 98px;
            left: 120px;
            transform: rotate(30deg);
        }

        /* Main container */

        .container {
            width: min(900px, 100%);
            position: relative;
            z-index: 5;
        }

        .glass-card {
            width: 100%;
            padding: 55px 45px;
            border-radius: 32px;

            background: rgba(255, 255, 255, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.60);

            box-shadow:
                0 25px 70px rgba(61, 47, 120, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            text-align: center;
        }

        /* Title */

        .small-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #6350a2;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .title {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -3px;

            background: linear-gradient(
                90deg,
                #4f2a9b,
                #7044c7,
                #376fc5
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 18px;
        }

        .subtitle {
            font-size: 15px;
            letter-spacing: 3px;
            font-weight: 600;
            color: #5d5680;
            margin-bottom: 42px;
        }

        /* Contact cards */

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 20px;

            width: 100%;
            min-height: 92px;

            padding: 18px 24px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.65);

            box-shadow:
                0 12px 30px rgba(72, 54, 135, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);

            text-decoration: none;
            color: #30265f;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.58);

            box-shadow:
                0 18px 38px rgba(72, 54, 135, 0.16);
        }

        /* Logos */

        .contact-icon {
            width: 58px;
            height: 58px;
            min-width: 58px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                rgba(112, 70, 205, 0.95),
                rgba(63, 126, 225, 0.95)
            );

            color: white;

            box-shadow:
                0 10px 22px rgba(78, 73, 180, 0.25);
        }

        .contact-icon svg {
            width: 29px;
            height: 29px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .telegram-icon svg {
            fill: white;
            stroke: none;
        }

        .contact-text {
            text-align: left;
            min-width: 0;
        }

        .contact-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #706796;
            margin-bottom: 7px;
            text-transform: uppercase;
        }

        .contact-value {
            display: block;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 600;
            color: #30245f;
            word-break: break-word;
        }

        /* Back button */

        .back-button {
            margin-top: 38px;

            border: none;
            outline: none;
            cursor: pointer;

            min-width: 180px;
            padding: 15px 30px;

            border-radius: 50px;

            background: linear-gradient(
                90deg,
                #6541b9,
                #4d82dc
            );

            color: white;

            font-family: "Inter", sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;

            box-shadow:
                0 12px 25px rgba(74, 66, 174, 0.25);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 16px 30px rgba(74, 66, 174, 0.32);
        }

        .back-button:active {
            transform: translateY(0);
        }

        /* Footer */

        .footer {
            margin-top: 34px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(52, 43, 92, 0.62);
        }

        .footer strong {
            color: #4e398c;
        }

        /* Decorative wave */

        .wave {
            position: absolute;
            left: -5%;
            bottom: -90px;
            width: 110%;
            height: 190px;

            background: rgba(255, 255, 255, 0.15);

            border-radius: 50% 50% 0 0 / 100% 100% 0 0;

            transform: rotate(-2deg);
            pointer-events: none;
        }

        /* Mobile */

        @media (max-width: 650px) {

            .page {
                padding: 20px 14px;
            }

            .glass-card {
                padding: 40px 18px;
                border-radius: 26px;
            }

            .small-title {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .title {
                font-size: 48px;
                letter-spacing: -2px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 2px;
                margin-bottom: 30px;
            }

            .contact-card {
                padding: 15px;
                gap: 14px;
                min-height: 82px;
                border-radius: 19px;
            }

            .contact-icon {
                width: 50px;
                height: 50px;
                min-width: 50px;
                border-radius: 15px;
            }

            .contact-icon svg {
                width: 25px;
                height: 25px;
            }

            .contact-label {
                font-size: 10px;
                letter-spacing: 1.5px;
            }

            .contact-value {
                font-size: 13px;
            }

            .back-button {
                min-width: 160px;
                padding: 13px 25px;
            }

            .molecule-left {
                left: -70px;
                top: 5%;
                opacity: 0.18;
            }

            .molecule-right {
                right: -70px;
                bottom: 5%;
                opacity: 0.18;
            }

            .footer {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <div class="molecule-left">
            <div class="atom one"></div>
            <div class="atom two"></div>
            <div class="atom three"></div>

            <div class="bond one"></div>

        <div class="molecule-right">

                    <a

                            <span class="contact-label">

                </div>

                <button
                    class="back-button"
                    id="backButton"

                    BACK

                <div class="footer">
                    A PROJECT CREATED BY
                    <strong>MERIEM IPPS</strong>
                </div>

            </section>

        </main>

    </div>


    <script>

        const backButton =
            document.getElementById("backButton");

        backButton.addEventListener(
            "click",
            function () {

                window.location.href = "index.html";

            }
        );

    </script>

</body>
</html>

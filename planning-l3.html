<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planning L1 | PharmSinergy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                "Inter",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #315f55;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(211, 255, 193, 0.65),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(123, 213, 255, 0.45),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(255, 238, 119, 0.48),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #dfffd5 0%,
                    #f7f8bd 35%,
                    #d7f4e7 65%,
                    #a9ddf5 100%
                );
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 24px 20px 30px;

            overflow: hidden;
            isolation: isolate;
        }


        /* =====================================================
           BACKGROUND ORBS
        ===================================================== */

        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(60px);

            pointer-events: none;

            z-index: -5;
        }

        .orb-one {
            width: 330px;
            height: 330px;

            top: -120px;
            left: -100px;

            background:
                rgba(147, 255, 118, 0.38);

            animation:
                floatOne
                10s
                ease-in-out
                infinite;
        }

        .orb-two {
            width: 350px;
            height: 350px;

            right: -130px;
            bottom: -130px;

            background:
                rgba(74, 191, 255, 0.35);

            animation:
                floatTwo
                12s
                ease-in-out
                infinite;
        }

        .orb-three {
            width: 180px;
            height: 180px;

            top: 40%;
            left: 48%;

            background:
                rgba(255, 241, 111, 0.28);

            filter: blur(70px);
        }


        /* =====================================================
           PHARMACY DECORATIONS
        ===================================================== */

        .pill {
            position: absolute;

            width: 105px;
            height: 42px;

            border-radius: 999px;

            transform: rotate(-28deg);

            border:
                1px solid
                rgba(255,255,255,0.45);

            background:
                linear-gradient(
                    90deg,
                    rgba(116,205,116,0.35) 0%,
                    rgba(116,205,116,0.35) 49%,
                    rgba(75,180,240,0.32) 51%,
                    rgba(75,180,240,0.32) 100%
                );

            box-shadow:
                0 12px 30px
                rgba(50,120,100,0.12),

                inset
                0 1px 0
                rgba(255,255,255,0.55);

            opacity: 0.55;

            pointer-events: none;

            z-index: -2;
        }

        .pill-one {
            left: -20px;
            top: 27%;
        }

        .pill-two {
            right: -20px;
            top: 20%;

            width: 85px;
            height: 34px;

            transform: rotate(28deg);

            opacity: 0.40;
        }

        .pill-three {
            right: 8%;
            bottom: 8%;

            width: 65px;
            height: 26px;

            transform: rotate(-20deg);

            opacity: 0.35;
        }


        /* =====================================================
           BUBBLES
        ===================================================== */

        .bubble {
            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.55);

            background:
                rgba(255,255,255,0.18);

            box-shadow:
                inset
                0 1px 5px
                rgba(255,255,255,0.55),

                0 8px 25px
                rgba(58,130,120,0.08);

            pointer-events: none;

            z-index: -2;
        }

        .bubble-one {
            width: 45px;
            height: 45px;

            top: 13%;
            left: 12%;
        }

        .bubble-two {
            width: 22px;
            height: 22px;

            top: 20%;
            right: 13%;
        }

        .bubble-three {
            width: 70px;
            height: 70px;

            bottom: 7%;
            left: 6%;
        }

        .bubble-four {
            width: 30px;
            height: 30px;

            bottom: 22%;
            right: 15%;
        }


        /* =====================================================
           MOLECULE
        ===================================================== */

        .molecule {
            position: absolute;

            width: 125px;
            height: 125px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.40);

            opacity: 0.40;

            pointer-events: none;

            z-index: -2;
        }

        .molecule::before {
            content: "";

            position: absolute;

            width: 70px;
            height: 70px;

            top: 27px;
            left: 27px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.38);
        }

        .molecule::after {
            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            top: 13px;
            right: 13px;

            background:
                rgba(255,255,255,0.65);

            box-shadow:
                -88px 42px 0
                rgba(255,255,255,0.40),

                38px 84px 0
                rgba(255,255,255,0.35);
        }

        .molecule-one {
            top: 4%;
            right: 3%;

            transform: rotate(20deg);
        }

        .molecule-two {
            bottom: 3%;
            left: 3%;

            transform:
                rotate(-25deg)
                scale(.85);
        }


        /* =====================================================
           LIGHT DOTS
        ===================================================== */

        .dot {
            position: absolute;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.90);

            box-shadow:
                0 0 16px
                rgba(255,255,255,0.85);

            animation:
                pulse
                4s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: -1;
        }

        .dot-one {
            top: 18%;
            left: 22%;
        }

        .dot-two {
            top: 30%;
            right: 20%;

            animation-delay: .8s;
        }

        .dot-three {
            bottom: 19%;
            left: 20%;

            animation-delay: 1.5s;
        }

        .dot-four {
            bottom: 25%;
            right: 22%;

            animation-delay: 2.2s;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-button {
            position: fixed;

            top: 20px;
            left: 22px;

            padding: 9px 17px;

            border:
                1px solid
                rgba(255,255,255,0.72);

            border-radius: 999px;

            background:
                rgba(255,255,255,0.35);

            color: #327367;

            font-size: .76rem;
            font-weight: 800;

            cursor: pointer;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 8px 24px
                rgba(46,112,95,0.12);

            transition: .25s ease;

            z-index: 50;
        }

        .back-button:hover {
            transform: translateX(-4px);

            background:
                rgba(255,255,255,0.55);

            box-shadow:
                0 12px 28px
                rgba(46,112,95,0.18);
        }


        /* =====================================================
           MAIN GLASS CARD
        ===================================================== */

        .content {
            position: relative;

            width: min(1180px, 94%);

            margin-top: 30px;

            padding: 25px 28px 28px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.52),
                    rgba(255,255,255,0.20)
                );

            border:
                1px solid
                rgba(255,255,255,0.75);

            box-shadow:
                0 30px 80px
                rgba(50,110,100,0.16),

                inset
                0 1px 0
                rgba(255,255,255,0.90);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            animation:
                cardAppear
                .8s
                cubic-bezier(.2,.8,.2,1)
                both;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            text-align: center;

            margin-bottom: 20px;
        }

        .top-line {
            width: 78px;
            height: 3px;

            margin: 0 auto 11px;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #65bd73,
                    #d9db59,
                    #56aee4
                );
        }

        .mini-label {
            font-size: .62rem;

            font-weight: 800;

            letter-spacing: .27em;

            color: #518477;

            text-transform: uppercase;

            margin-bottom: 5px;
        }

        .title {
            font-family: "Kufam", sans-serif;

            font-size:
                clamp(
                    1.65rem,
                    4vw,
                    2.7rem
                );

            font-weight: 800;

            color: #39796b;

            text-shadow:
                0 5px 18px
                rgba(48,105,90,0.13);

            margin-bottom: 5px;
        }

        .subtitle {
            font-size: .76rem;

            font-weight: 600;

            color: #648e82;

            margin-bottom: 3px;
        }

        .speciality {
            font-size: .59rem;

            color: #799f95;

            font-weight: 700;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .planner-top {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 16px;
        }

        .today-button {
            border: none;

            padding: 9px 15px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    rgba(118,205,116,.30),
                    rgba(250,232,89,.30)
                );

            border:
                1px solid
                rgba(255,255,255,.65);

            color: #3c7a68;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(72,130,96,.09);

            transition: .2s ease;
        }

        .today-button:hover {
            transform: translateY(-2px);
        }

        .week-label {
            font-size: .72rem;

            font-weight: 800;

            color: #648f83;

            text-align: right;
        }


        /* =====================================================
           WEEK GRID
        ===================================================== */

        .week-grid {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 10px;
        }


        /* =====================================================
           DAY CARD
        ===================================================== */

        .day-card {
            position: relative;

            min-height: 330px;

            padding: 12px;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.46),
                    rgba(255,255,255,.19)
                );

            border:
                1px solid
                rgba(255,255,255,.68);

            box-shadow:
                0 9px 25px
                rgba(50,110,95,.07),

                inset
                0 1px 0
                rgba(255,255,255,.75);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition: .25s ease;

            overflow: hidden;
        }

        .day-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 32px
                rgba(50,110,95,.12);
        }


        /* =====================================================
           TODAY
        ===================================================== */

        .day-card.today {
            border:
                2px solid
                rgba(93,185,117,.55);

            background:
                linear-gradient(
                    145deg,
                    rgba(212,255,196,.55),
                    rgba(255,246,151,.25)
                );

            box-shadow:
                0 15px 34px
                rgba(83,156,104,.14);
        }

        .today-badge {
            display: none;

            position: absolute;

            top: 8px;
            right: 8px;

            padding: 4px 7px;

            border-radius: 999px;

            font-size: .46rem;

            font-weight: 800;

            color: #39735f;

            background:
                rgba(206,255,188,.70);

            border:
                1px solid
                rgba(92,180,104,.25);
        }

        .day-card.today .today-badge {
            display: block;
        }


        /* =====================================================
           DAY HEADER
        ===================================================== */

        .day-header {
            text-align: center;

            padding-bottom: 9px;

            border-bottom:
                1px solid
                rgba(92,150,135,.13);

            margin-bottom: 9px;
        }

        .day-name {
            font-size: .68rem;

            font-weight: 800;

            color: #4a8072;

            text-transform: uppercase;
        }

        .day-number {
            font-size: 1.25rem;

            font-weight: 800;

            color: #397568;

            margin-top: 2px;
        }

        .task-count {
            display: inline-block;

            margin-top: 4px;

            padding: 3px 7px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.42);

            color: #73968d;

            font-size: .45rem;

            font-weight: 800;
        }


        /* =====================================================
           TASK LIST
        ===================================================== */

        .task-list {
            min-height: 165px;

            max-height: 185px;

            overflow-y: auto;

            padding-right: 3px;
        }

        .task-list::-webkit-scrollbar {
            width: 4px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background:
                rgba(82,145,126,.25);

            border-radius: 999px;
        }


        /* =====================================================
           TASK
        ===================================================== */

        .task {
            display: flex;

            align-items: flex-start;

            gap: 7px;

            padding: 7px;

            margin-bottom: 6px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.34);

            border:
                1px solid
                rgba(255,255,255,.48);

            animation:
                taskAppear
                .3s
                ease
                both;
        }

        .task-text {
            flex: 1;

            min-width: 0;

            font-size: .55rem;

            line-height: 1.35;

            font-weight: 700;

            color: #4f766d;

            word-break: break-word;
        }

        .delete-task {
            flex-shrink: 0;

            width: 20px;
            height: 20px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,120,120,.16);

            color: #bb7070;

            font-size: .65rem;

            cursor: pointer;

            transition: .2s ease;
        }

        .delete-task:hover {
            background:
                rgba(255,100,100,.30);

            transform: scale(1.1);
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {
            text-align: center;

            padding: 18px 4px;

            color: #88a79e;

            font-size: .52rem;

            font-weight: 600;
        }

        .empty-icon {
            display: block;

            font-size: 1.25rem;

            margin-bottom: 5px;

            opacity: .55;
        }


        /* =====================================================
           ADD TASK
        ===================================================== */

        .add-task {
            display: flex;

            gap: 5px;

            margin-top: 8px;
        }

        .task-input {
            min-width: 0;

            flex: 1;

            padding: 7px 8px;

            border-radius: 9px;

            border:
                1px solid
                rgba(255,255,255,.70);

            outline: none;

            background:
                rgba(255,255,255,.43);

            color: #4b7469;

            font-family: "Inter", sans-serif;

            font-size: .51rem;

            font-weight: 600;

            transition: .2s ease;
        }

        .task-input::placeholder {
            color: #91aaa3;
        }

        .task-input:focus {
            background:
                rgba(255,255,255,.62);

            border-color:
                rgba(86,171,133,.38);

            box-shadow:
                0 0 0 3px
                rgba(95,180,125,.09);
        }

        .add-button {
            width: 29px;
            height: 29px;

            flex-shrink: 0;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #80c879,
                    #61b8dd
                );

            color: white;

            font-size: 1rem;

            font-weight: 800;

            box-shadow:
                0 5px 13px
                rgba(74,151,124,.15);

            transition: .2s ease;
        }

        .add-button:hover {
            transform: scale(1.07);
        }

        .add-button:active {
            transform: scale(.94);
        }


        /* =====================================================
           CALENDAR
        ===================================================== */

        .calendar-section {
            margin-top: 17px;

            padding: 15px;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.38),
                    rgba(255,255,255,.17)
                );

            border:
                1px solid
                rgba(255,255,255,.58);

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.65);
        }

        .calendar-title {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 10px;
        }

        .calendar-title h2 {
            font-size: .75rem;

            color: #4d8275;

            font-weight: 800;
        }

        .calendar-title span {
            font-size: .53rem;

            color: #82a299;

            font-weight: 600;
        }


        /* =====================================================
           CALENDAR SCROLL
        ===================================================== */

        .calendar-scroll {
            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 7px;

            scroll-behavior: smooth;

            cursor: grab;
        }

        .calendar-scroll:active {
            cursor: grabbing;
        }

        .calendar-scroll::-webkit-scrollbar {
            height: 5px;
        }

        .calendar-scroll::-webkit-scrollbar-thumb {
            background:
                rgba(82,145,126,.25);

            border-radius: 999px;
        }


        /* =====================================================
           MONTH CARD
        ===================================================== */

        .month-card {
            flex: 0 0 250px;

            padding: 10px;

            border-radius: 15px;

            background:
                rgba(255,255,255,.31);

            border:
                1px solid
                rgba(255,255,255,.53);
        }

        .month-name {
            text-align: center;

            font-size: .62rem;

            font-weight: 800;

            color: #528477;

            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 3px;
        }

        .calendar-day-name {
            text-align: center;

            font-size: .40rem;

            font-weight: 800;

            color: #8ba59e;

            padding-bottom: 3px;
        }

        .calendar-day {
            height: 26px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 7px;

            font-size: .47rem;

            font-weight: 700;

            color: #60877d;

            cursor: pointer;

            transition: .15s ease;

            position: relative;
        }

        .calendar-day:hover {
            background:
                rgba(255,255,255,.55);

            transform: scale(1.05);
        }

        .calendar-day.today {
            background:
                linear-gradient(
                    135deg,
                    rgba(120,205,118,.60),
                    rgba(255,231,91,.52)
                );

            color: #39735e;

            font-weight: 900;
        }

        .calendar-day.selected {
            outline:
                2px solid
                rgba(67,160,125,.45);

            background:
                rgba(255,255,255,.58);
        }

        .calendar-day.has-task::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            bottom: 3px;

            background:
                #63a879;
        }


        /* =====================================================
           SELECTED DATE PANEL
        ===================================================== */

        .selected-panel {
            margin-top: 10px;

            display: none;

            padding: 10px 12px;

            border-radius: 13px;

            background:
                rgba(255,255,255,.32);

            border:
                1px solid
                rgba(255,255,255,.50);

            color: #587d73;

            font-size: .55rem;

            font-weight: 700;
        }

        .selected-panel.show {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .selected-date {
            color: #39796a;

            font-weight: 800;
        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        .notification {
            position: fixed;

            right: 22px;
            bottom: 22px;

            max-width: 310px;

            padding: 12px 15px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.78);

            border:
                1px solid
                rgba(255,255,255,.85);

            box-shadow:
                0 15px 40px
                rgba(50,110,95,.18);

            backdrop-filter: blur(15px);

            color: #4c796d;

            font-size: .62rem;

            font-weight: 700;

            transform:
                translateY(30px);

            opacity: 0;

            pointer-events: none;

            transition: .3s ease;

            z-index: 100;
        }

        .notification.show {
            transform:
                translateY(0);

            opacity: 1;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes taskAppear {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes floatOne {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(18px,15px);
            }
        }

        @keyframes floatTwo {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(-18px,-18px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .25;

                transform:
                    scale(.75);
            }

            50% {
                opacity: .95;

                transform:
                    scale(1.2);
            }
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1050px) {

            .week-grid {
                grid-template-columns:
                    repeat(4, 1fr);
            }

            .day-card {
                min-height: 290px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .page {
                padding:
                    15px 10px 25px;
            }

            .content {
                width: 96%;

                margin-top: 35px;

                padding:
                    19px 13px 18px;

                border-radius: 25px;
            }

            .back-button {
                top: 12px;
                left: 12px;

                padding:
                    8px 13px;

                font-size: .65rem;
            }

            .mini-label {
                font-size: .52rem;
            }

            .title {
                font-size: 1.55rem;
            }

            .subtitle {
                font-size: .60rem;
            }

            .speciality {
                font-size: .50rem;
            }

            .planner-top {
                margin-top: 5px;
            }

            .today-button {
                padding:
                    8px 11px;

                font-size: .60rem;
            }

            .week-label {
                font-size: .54rem;
            }

            .week-grid {
                display: flex;

                overflow-x: auto;

                scroll-snap-type: x mandatory;

                gap: 9px;

                padding-bottom: 7px;
            }

            .week-grid::-webkit-scrollbar {
                height: 5px;
            }

            .week-grid::-webkit-scrollbar-thumb {
                background:
                    rgba(82,145,126,.25);

                border-radius: 999px;
            }

            .day-card {
                flex:
                    0 0 235px;

                min-height: 310px;

                scroll-snap-align: start;
            }

            .calendar-section {
                padding: 11px;
            }

            .month-card {
                flex-basis: 235px;
            }

            .notification {
                right: 12px;
                bottom: 12px;
                left: 12px;

                max-width: none;
            }
        }

    </style>
</head>


<body>

    <main class="page">


        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>

        <div class="pill pill-one"></div>
        <div class="pill pill-two"></div>
        <div class="pill pill-three"></div>

        <div class="bubble bubble-one"></div>
        <div class="bubble bubble-two"></div>
        <div class="bubble bubble-three"></div>
        <div class="bubble bubble-four"></div>

        <div class="molecule molecule-one"></div>
        <div class="molecule molecule-two"></div>

        <div class="dot dot-one"></div>
        <div class="dot dot-two"></div>
        <div class="dot dot-three"></div>
        <div class="dot dot-four"></div>


        <!-- =================================================
             RETOUR
        ================================================== -->

        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            ← Retour
        </button>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <section class="content">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <header class="header">

                <div class="top-line"></div>

                <div class="mini-label">
                    PHARMSINERGY • LICENCE 3
                </div>

                <h1 class="title">
                    Planning étudiant
                </h1>

                <p class="subtitle">
                    Organise tes journées, tes cours et tes révisions
                </p>

                <p class="speciality">
                    Pharmacie industrielle — Agenda • Organisation • Révision
                </p>

            </header>


            <!-- =================================================
                 PLANNER TOP
            ================================================== -->

            <div class="planner-top">

                <button
                    class="today-button"
                    id="todayButton"
                    type="button"
                >
                    📅 Aujourd'hui
                </button>

                <div
                    class="week-label"
                    id="weekLabel"
                >
                    Semaine actuelle
                </div>

            </div>


            <!-- =================================================
                 WEEK
            ================================================== -->

            <div
                class="week-grid"
                id="weekGrid"
            >
            </div>


            <!-- =================================================
                 CALENDAR
            ================================================== -->

            <section class="calendar-section">

                <div class="calendar-title">

                    <h2>
                        🗓️ Calendrier étudiant
                    </h2>

                    <span>
                        Fais défiler les mois →
                    </span>

                </div>


                <div
                    class="calendar-scroll"
                    id="calendarScroll"
                >
                </div>


                <div
                    class="selected-panel"
                    id="selectedPanel"
                >

                    <span>
                        📌 Date sélectionnée :
                        <span
                            class="selected-date"
                            id="selectedDate"
                        >
                        </span>
                    </span>

                    <span>
                        Ajoute ta tâche dans le jour correspondant ↑
                    </span>

                </div>

            </section>


        </section>

    </main>


    <!-- =================================================
         NOTIFICATION
    ================================================== -->

    <div
        class="notification"
        id="notification"
    >
    </div>


    <script>

        /* =====================================================
           STORAGE
        ===================================================== */

        const STORAGE_KEY =
            "pharmsinergy_planning_l3";


        let tasks =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            ) || {};


        /* =====================================================
           DATE HELPERS
        ===================================================== */

        const monthNames = [
            "Janvier",
            "Février",
            "Mars",
            "Avril",
            "Mai",
            "Juin",
            "Juillet",
            "Août",
            "Septembre",
            "Octobre",
            "Novembre",
            "Décembre"
        ];


        const dayNames = [
            "Dim",
            "Lun",
            "Mar",
            "Mer",
            "Jeu",
            "Ven",
            "Sam"
        ];


        const frenchWeekNames = [
            "Dimanche",
            "Lundi",
            "Mardi",
            "Mercredi",
            "Jeudi",
            "Vendredi",
            "Samedi"
        ];


        function dateKey(date) {

            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }


        function saveTasks() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(tasks)
            );
        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        let notificationTimer;


        function showNotification(message) {

            const notification =
                document.getElementById(
                    "notification"
                );

            notification.textContent =
                message;

            notification.classList.add(
                "show"
            );

            clearTimeout(
                notificationTimer
            );

            notificationTimer =
                setTimeout(
                    () => {

                        notification.classList.remove(
                            "show"
                        );

                    },
                    3500
                );
        }


        /* =====================================================
           TODAY
        ===================================================== */

        function getToday() {

            const today =
                new Date();

            today.setHours(
                0,0,0,0
            );

            return today;
        }


        /* =====================================================
           WEEK
           
           Samedi → Vendredi
        ===================================================== */

        function getSaturdayWeek() {

            const today =
                getToday();

            const day =
                today.getDay();

            const daysFromSaturday =
                (day + 1) % 7;

            const saturday =
                new Date(today);

            saturday.setDate(
                today.getDate()
                - daysFromSaturday
            );

            return saturday;
        }


        function renderWeek() {

            const weekGrid =
                document.getElementById(
                    "weekGrid"
                );

            weekGrid.innerHTML = "";


            const saturday =
                getSaturdayWeek();


            const todayKey =
                dateKey(
                    getToday()
                );


            const frenchDays =
                [
                    "Samedi",
                    "Dimanche",
                    "Lundi",
                    "Mardi",
                    "Mercredi",
                    "Jeudi",
                    "Vendredi"
                ];


            for (
                let i = 0;
                i < 7;
                i++
            ) {

                const date =
                    new Date(saturday);

                date.setDate(
                    saturday.getDate()
                    + i
                );


                const key =
                    dateKey(date);


                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "day-card";


                if (
                    key === todayKey
                ) {

                    card.classList.add(
                        "today"
                    );

                }


                const count =
                    tasks[key]
                    ? tasks[key].length
                    : 0;


                card.innerHTML = `

                    <span class="today-badge">
                        AUJOURD'HUI
                    </span>


                    <div class="day-header">

                        <div class="day-name">
                            ${frenchDays[i]}
                        </div>

                        <div class="day-number">
                            ${date.getDate()}
                        </div>

                        <span class="task-count">
                            ${count}
                            tâche${count > 1 ? "s" : ""}
                        </span>

                    </div>


                    <div
                        class="task-list"
                        data-date="${key}"
                    >
                    </div>


                    <div class="add-task">

                        <input
                            class="task-input"
                            type="text"
                            placeholder="Ex : Examen de pharmacologie..."
                            maxlength="120"
                        >

                        <button
                            class="add-button"
                            type="button"
                            title="Ajouter"
                        >
                            +
                        </button>

                    </div>

                `;


                const input =
                    card.querySelector(
                        ".task-input"
                    );


                const addButton =
                    card.querySelector(
                        ".add-button"
                    );


                addButton.addEventListener(
                    "click",
                    () => {

                        addTask(
                            key,
                            input.value
                        );

                        input.value = "";

                    }
                );


                input.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key === "Enter"
                        ) {

                            addTask(
                                key,
                                input.value
                            );

                            input.value = "";

                        }

                    }
                );


                weekGrid.appendChild(
                    card
                );


                renderTasksForDay(
                    key,
                    card
                );

            }


            const endDate =
                new Date(saturday);

            endDate.setDate(
                saturday.getDate() + 6
            );


            document.getElementById(
                "weekLabel"
            ).textContent =
                `${saturday.getDate()} ${monthNames[saturday.getMonth()]} → ${endDate.getDate()} ${monthNames[endDate.getMonth()]}`;

        }


        /* =====================================================
           RENDER TASKS
        ===================================================== */

        function renderTasksForDay(
            key,
            card
        ) {

            const list =
                card.querySelector(
                    ".task-list"
                );


            if (
                !tasks[key]
                ||
                tasks[key].length === 0
            ) {

                list.innerHTML = `

                    <div class="empty">

                        <span class="empty-icon">
                            💊
                        </span>

                        Aucune tâche pour le moment

                    </div>

                `;

                return;

            }


            list.innerHTML = "";


            tasks[key].forEach(
                (task, index) => {

                    const taskElement =
                        document.createElement(
                            "div"
                        );

                    taskElement.className =
                        "task";


                    taskElement.innerHTML = `

                        <span class="task-text">
                            ${escapeHTML(task)}
                        </span>

                        <button
                            class="delete-task"
                            type="button"
                            title="Supprimer"
                        >
                            ×
                        </button>

                    `;


                    taskElement
                        .querySelector(
                            ".delete-task"
                        )
                        .addEventListener(
                            "click",
                            () => {

                                deleteTask(
                                    key,
                                    index
                                );

                            }
                        );


                    list.appendChild(
                        taskElement
                    );

                }
            );

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;
        }


        /* =====================================================
           ADD TASK
        ===================================================== */

        function addTask(
            key,
            text
        ) {

            const cleanText =
                text.trim();


            if (
                !cleanText
            ) {

                showNotification(
                    "✏️ Écris d'abord une tâche."
                );

                return;

            }


            if (
                !tasks[key]
            ) {

                tasks[key] = [];

            }


            tasks[key].push(
                cleanText
            );


            saveTasks();

            renderWeek();

            renderCalendars();

            showNotification(
                "✅ Tâche ajoutée à ton planning."
            );

        }


        /* =====================================================
           DELETE TASK
        ===================================================== */

        function deleteTask(
            key,
            index
        ) {

            if (
                !tasks[key]
            ) return;


            tasks[key].splice(
                index,
                1
            );


            if (
                tasks[key].length === 0
            ) {

                delete tasks[key];

            }


            saveTasks();

            renderWeek();

            renderCalendars();

            showNotification(
                "🗑️ Tâche supprimée."
            );

        }


        /* =====================================================
           CALENDAR
        ===================================================== */

        function renderCalendars() {

            const container =
                document.getElementById(
                    "calendarScroll"
                );

            container.innerHTML = "";


            const today =
                getToday();


            const startYear =
                today.getFullYear();


            const startMonth =
                today.getMonth();


            /*
                On affiche 12 mois :
                mois actuel + 11 mois suivants
            */

            for (
                let monthOffset = 0;
                monthOffset < 12;
                monthOffset++
            ) {

                const date =
                    new Date(
                        startYear,
                        startMonth + monthOffset,
                        1
                    );


                const year =
                    date.getFullYear();

                const month =
                    date.getMonth();


                const monthCard =
                    document.createElement(
                        "div"
                    );

                monthCard.className =
                    "month-card";


                let html = `

                    <div class="month-name">
                        ${monthNames[month]}
                        ${year}
                    </div>

                    <div class="calendar-grid">

                `;


                dayNames.forEach(
                    day => {

                        html += `

                            <div class="calendar-day-name">
                                ${day}
                            </div>

                        `;

                    }
                );


                const firstDay =
                    new Date(
                        year,
                        month,
                        1
                    );


                /*
                    On transforme Dimanche=0
                    en calendrier commençant Dimanche
                */

                const startingDay =
                    firstDay.getDay();


                for (
                    let i = 0;
                    i < startingDay;
                    i++
                ) {

                    html += `
                        <div></div>
                    `;

                }


                const daysInMonth =
                    new Date(
                        year,
                        month + 1,
                        0
                    ).getDate();


                for (
                    let day = 1;
                    day <= daysInMonth;
                    day++
                ) {

                    const currentDate =
                        new Date(
                            year,
                            month,
                            day
                        );


                    const key =
                        dateKey(
                            currentDate
                        );


                    const isToday =
                        key === dateKey(today);


                    const hasTask =
                        tasks[key]
                        &&
                        tasks[key].length > 0;


                    html += `

                        <div
                            class="
                                calendar-day
                                ${isToday ? "today" : ""}
                                ${hasTask ? "has-task" : ""}
                            "
                            data-date="${key}"
                        >
                            ${day}
                        </div>

                    `;

                }


                html += `
                    </div>
                `;


                monthCard.innerHTML =
                    html;


                monthCard
                    .querySelectorAll(
                        ".calendar-day[data-date]"
                    )
                    .forEach(
                        dayElement => {

                            dayElement.addEventListener(
                                "click",
                                () => {

                                    selectCalendarDate(
                                        dayElement.dataset.date
                                    );

                                }
                            );

                        }
                    );


                container.appendChild(
                    monthCard
                );

            }


            /*
                Scroll automatiquement
                vers le mois actuel
            */

            const firstMonth =
                container.firstElementChild;

            if (
                firstMonth
            ) {

                container.scrollLeft = 0;

            }

        }


        /* =====================================================
           SELECT DATE
        ===================================================== */

        function selectCalendarDate(
            key
        ) {

            const date =
                new Date(
                    key + "T00:00:00"
                );


            const formatted =
                `${frenchWeekNames[date.getDay()]} ${date.getDate()} ${monthNames[date.getMonth()]} ${date.getFullYear()}`;


            document.getElementById(
                "selectedDate"
            ).textContent =
                formatted;


            document.getElementById(
                "selectedPanel"
            ).classList.add(
                "show"
            );


            /*
                Si la date choisie est
                dans la semaine actuelle,
                on la met en évidence
            */

            showNotification(
                `📅 ${formatted}`
            );

        }


        /* =====================================================
           TODAY BUTTON
        ===================================================== */

        document.getElementById(
            "todayButton"
        ).addEventListener(
            "click",
            () => {

                renderWeek();

                renderCalendars();

                document.getElementById(
                    "selectedPanel"
                ).classList.remove(
                    "show"
                );

                showNotification(
                    "📅 Tu es revenu à aujourd'hui."
                );

            }
        );


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        document.getElementById(
            "backButton"
        ).addEventListener(
            "click",
            () => {

                window.location.href =
                    "carnet-l3.html";

            }
        );


        /* =====================================================
           REMINDER
           
           Vérifie les tâches prévues demain.
        ===================================================== */

        function checkTomorrowReminder() {

            const tomorrow =
                getToday();

            tomorrow.setDate(
                tomorrow.getDate() + 1
            );


            const key =
                dateKey(tomorrow);


            if (
                tasks[key]
                &&
                tasks[key].length > 0
            ) {

                showNotification(
                    `🔔 Rappel : demain tu as ${tasks[key].length} tâche${tasks[key].length > 1 ? "s" : ""} prévue${tasks[key].length > 1 ? "s" : ""}.`
                );

            }

        }


        /* =====================================================
           INITIALISATION
        ===================================================== */

        renderWeek();

        renderCalendars();

        setTimeout(
            checkTomorrowReminder,
            1000
        );


    </script>

</body>
</html>
